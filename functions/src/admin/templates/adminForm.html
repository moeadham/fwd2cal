<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin: Trigger Drive Organization</title>
  <style>%STYLES%</style>
</head>
<body>
  <div class="card">
    <h1>Trigger Drive Organization</h1>
    <p class="desc">Manually trigger the organization process for a given user.</p>
    <form id="adminForm">
      <div class="form-group">
        <label for="apiKey">API Key</label>
        <input type="password" id="apiKey" required>
      </div>
      <div class="form-group">
        <label for="userEmailOrUid">User Email or UID</label>
        <input type="text" id="userEmailOrUid" placeholder="e.g. user@example.com" required>
      </div>
      <button type="submit" id="submitBtn">Run Organization</button>
    </form>
    
    <div id="responseContainer" class="hidden">
      <h2>Response</h2>
      <pre id="responseArea"></pre>
    </div>
  </div>

  <div class="card" style="margin-top: 24px">
    <h1>Failed/Stuck Proposals</h1>
    <button id="loadBtn">Load Proposals</button>
    <div id="proposalsContainer"></div>
  </div>

  <script>
    document.getElementById('adminForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const apiKey = document.getElementById('apiKey').value;
      const emailOrUid = document.getElementById('userEmailOrUid').value.trim();
      const submitBtn = document.getElementById('submitBtn');
      const responseContainer = document.getElementById('responseContainer');
      const responseArea = document.getElementById('responseArea');
      
      submitBtn.disabled = true;
      submitBtn.textContent = 'Processing...';
      responseContainer.classList.remove('hidden');
      responseArea.textContent = 'Loading...';
      
      const payload = emailOrUid.includes('@') ? { email: emailOrUid } : { uid: emailOrUid };
      
      try {
        const res = await fetch('', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-admin-key': apiKey
          },
          body: JSON.stringify(payload)
        });
        
        let data;
        try {
          data = await res.json();
        } catch (err) {
          data = await res.text();
        }
        
        responseArea.textContent = JSON.stringify(data, null, 2);
        if (!res.ok) {
          responseArea.textContent += '\\n\\nStatus: ' + res.status;
        }
      } catch (err) {
        responseArea.textContent = 'Error: ' + err.message;
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Run Organization';
      }
    });

    document.getElementById('loadBtn').addEventListener('click', async () => {
      const apiKey = document.getElementById('apiKey').value;
      if (!apiKey) {
        alert('Please enter API Key');
        return;
      }
      
      const loadBtn = document.getElementById('loadBtn');
      const container = document.getElementById('proposalsContainer');
      
      loadBtn.disabled = true;
      loadBtn.textContent = 'Loading...';
      
      try {
        const res = await fetch('', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-admin-key': apiKey
          },
          body: JSON.stringify({ action: 'list' })
        });
        
        let data;
        try {
          data = await res.json();
        } catch (err) {
          throw new Error('Failed to parse response: ' + res.statusText);
        }
        
        if (!Array.isArray(data) || data.length === 0) {
          container.innerHTML = '<p style="margin-top: 16px; color: var(--text-muted);">' +
            'No failed or stuck proposals found</p>';
          return;
        }
        
        let tableHtml = '<table>' +
          '<thead>' +
            '<tr>' +
              '<th>Email</th>' +
              '<th>Status</th>' +
              '<th>Progress</th>' +
              '<th>Error</th>' +
              '<th>Attempts</th>' +
              '<th>Created</th>' +
              '<th>Action</th>' +
            '</tr>' +
          '</thead>' +
          '<tbody>';
        
        data.forEach(p => {
          const progress = (p.currentChunk !== undefined && p.totalChunks !== undefined) 
            ? p.currentChunk + '/' + p.totalChunks 
            : 'N/A';
          const errText = p.lastError 
            ? (p.lastError.length > 80 ? p.lastError.substring(0, 80) + '...' : p.lastError) 
            : '';
          const createdText = p.createdAt ? new Date(p.createdAt).toLocaleString() : '';
          
          tableHtml += '<tr>' +
            '<td>' + (p.senderEmail || p.emailId || '') + '</td>' +
            '<td>' + (p.status || '') + '</td>' +
            '<td>' + progress + '</td>' +
            '<td>' + errText + '</td>' +
            '<td>' + (p.attemptCount || 0) + '</td>' +
            '<td>' + createdText + '</td>' +
            '<td>' +
              '<button class="resume-btn" data-id="' + p.id + '" ' + 
              'style="width: auto; padding: 6px 12px; font-size: 0.8rem">Resume</button>' +
            '</td>' +
          '</tr>';
        });
        
        tableHtml += '</tbody></table>';
        container.innerHTML = tableHtml;
        
      } catch (err) {
        container.innerHTML = '<p style="margin-top: 16px; color: #ef4444;">Error: ' + err.message + '</p>';
      } finally {
        loadBtn.disabled = false;
        loadBtn.textContent = 'Load Proposals';
      }
    });

    document.getElementById('proposalsContainer').addEventListener('click', async (e) => {
      if (e.target && e.target.classList.contains('resume-btn')) {
        const apiKey = document.getElementById('apiKey').value;
        if (!apiKey) {
          alert('Please enter API Key');
          return;
        }
        
        const btn = e.target;
        const proposalId = btn.getAttribute('data-id');
        const originalText = btn.textContent;
        
        btn.disabled = true;
        btn.textContent = 'Resuming...';
        
        const responseContainer = document.getElementById('responseContainer');
        const responseArea = document.getElementById('responseArea');
        responseContainer.classList.remove('hidden');
        responseArea.textContent = 'Resuming proposal ' + proposalId + '...';
        
        try {
          const res = await fetch('', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'x-admin-key': apiKey
            },
            body: JSON.stringify({ action: 'retry', proposalId: proposalId })
          });
          
          let data;
          try {
            data = await res.json();
          } catch (err) {
            data = await res.text();
          }
          
          responseArea.textContent = JSON.stringify(data, null, 2);
          if (!res.ok) {
            responseArea.textContent += '\\n\\nStatus: ' + res.status;
          }
        } catch (err) {
          responseArea.textContent = 'Error: ' + err.message;
        } finally {
          btn.disabled = false;
          btn.textContent = originalText;
        }
      }
    });
  </script>
</body>
</html>
